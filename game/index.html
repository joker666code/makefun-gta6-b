<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmaris — An Open-World Crime Story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101826; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; z-index: 5; }
  .panel { background: rgba(10, 16, 28, 0.72); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px; }

  #top-right { position: absolute; top: 12px; right: 12px; padding: 10px 14px; text-align: right; min-width: 190px; }
  #money { font-size: 26px; font-weight: 800; color: #7ddb8a; letter-spacing: 0.5px; }
  #stars { font-size: 22px; letter-spacing: 3px; color: #8b93a3; }
  #stars.hot { color: #ffd76a; text-shadow: 0 0 8px rgba(255, 180, 40, 0.8); }
  #mission-count { font-size: 12px; color: #c8cdd6; margin-top: 2px; }

  #top-left { position: absolute; top: 12px; left: 12px; padding: 10px 14px; max-width: 420px; }
  #objective-label { font-size: 11px; letter-spacing: 2px; color: #f2b234; font-weight: 700; }
  #objective { font-size: 15px; font-weight: 600; margin-top: 3px; line-height: 1.35; }
  #announce { font-size: 13px; color: #ffd76a; margin-top: 5px; min-height: 17px; line-height: 1.3; }

  #bottom-left { position: absolute; left: 12px; bottom: 12px; padding: 10px 14px; width: 230px; }
  #health-row { display: flex; align-items: center; gap: 8px; }
  #health-bar { flex: 1; height: 12px; background: rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e5534b, #f2b234); border-radius: 6px; }
  #health-text { font-size: 13px; font-weight: 700; min-width: 26px; text-align: right; }
  #vehicle-row { display: flex; justify-content: space-between; margin-top: 7px; font-size: 13px; }
  #vehicle { font-weight: 700; color: #f2b234; }
  #speed { color: #c8cdd6; }
  #ammo { font-size: 13px; margin-top: 4px; color: #c8cdd6; }

  #minimap-wrap { position: absolute; right: 12px; bottom: 12px; padding: 6px; }
  #minimap { display: block; width: 204px; height: 156px; border-radius: 6px; }
  #minimap-label { font-size: 10px; letter-spacing: 2px; color: #c8cdd6; text-align: center; margin-top: 4px; }

  #controls { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; font-size: 11.5px; color: rgba(238,241,245,0.75); background: rgba(10,16,28,0.55); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmaris: a top-down open-world crime game. Steal cars, outrun the police and finish Danny Vega's five missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div id="hud">
  <div id="top-left" class="panel">
    <div id="objective-label">CURRENT JOB</div>
    <div id="objective">Welcome to Solmaris.</div>
    <div id="announce"></div>
  </div>
  <div id="top-right" class="panel">
    <div id="money">$0</div>
    <div id="stars">☆☆☆☆☆</div>
    <div id="mission-count">Mission 1/5</div>
  </div>
  <div id="bottom-left" class="panel">
    <div id="health-row"><span>❤</span><div id="health-bar"><div id="health-fill"></div></div><span id="health-text">100</span></div>
    <div id="vehicle-row"><span id="vehicle">On foot</span><span id="speed">—</span></div>
    <div id="ammo">🔫 12/48</div>
  </div>
  <div id="minimap-wrap" class="panel">
    <canvas id="minimap" width="204" height="156"></canvas>
    <div id="minimap-label">SOLMARIS</div>
  </div>
  <div id="controls">WASD move / drive &nbsp;·&nbsp; E enter car &nbsp;·&nbsp; Mouse aim, click shoot &nbsp;·&nbsp; F punch &nbsp;·&nbsp; R reload &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; P pause</div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
